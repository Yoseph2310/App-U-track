name: Build and Test Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      # Upload the APK so the next job can access it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  firebase-test-lab:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.ref, 'refs/heads/dependabot/') }}
    steps:
      - name: Check for Firebase Credentials
        id: secret-check
        run: |
          if [ -z "\${{ secrets.GCP_FIREBASE_CREDENTIALS }}" ]; then
            echo "⚠️ GCP_FIREBASE_CREDENTIALS secret is not available (likely a fork)."
            echo "⏩ Breaking job early to avoid failures."
            echo "should_skip=true" >> \$GITHUB_OUTPUT
          else
            echo "🚀 GCP_FIREBASE_CREDENTIALS secret found."
            echo "should_skip=false" >> \$GITHUB_OUTPUT
          fi
      # Download the APK uploaded in the previous job
      - name: Download APK Artifact
        uses: actions/download-artifact@v7
        with:
          name: app-debug.apk
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run Robo Test in Firebase Test Lab
        if: ${{ hashFiles('app-debug.apk') != '' }}
        run: |
          gcloud firebase test android run \
            --type robo \
            --app app-debug.apk \
            --device model=MediumPhone.arm,version=30,locale=en,orientation=portrait